# Detector settings. Rules: docs/ARCHITECTURE.md sections 2 and 3. Tuned on seed 20261022 only.
# Every run records this file's SHA-256 in detector_run.

[links]
# Highest strength each link type can carry before rarity and benign explanations.
caps = { SHARED_BANK = 0.85, SHARED_PHONE = 0.75, SHARED_EMAIL = 0.70, SHARED_CONTACT_PROVIDER = 0.85, DUPLICATE_INVOICE = 0.80, SIMILAR_NARRATIVE = 0.65, EARLY_CLAIM_PAIR = 0.55, SAME_INCIDENT = 0.45, SHARED_ADDRESS = 0.20 }
story_min_similarity = 0.85     # IDF-weighted Jaccard of narrative words
early_claim_max_days = 10       # incident within this many days of policy start
timing_window_days = 45         # two early claims at one provider within this many days
incident_min_parties = 3        # an incident with fewer claimants is an ordinary crash

[explanations]
household_factor = 0.1          # same surname and same address
building_factor = 0.3           # address with many residents at once
building_min_residents = 6
common_event_factor = 0.2       # same city, incident dates close together
common_event_days = 7
busy_provider_factor = 0.2      # provider with far more customers than most
busy_provider_percentile = 0.95

[rarity]
reference_log10 = 1.5           # a link type held by 10^-1.5 (about 3%) of claimants or fewer keeps its full cap
floor = 0.5                     # a common link type keeps at least half its cap

[indicators]
inflated_ratio = 2.0            # invoice total against the peer median for the same incident and provider type

[network]
min_link_strength = 0.15        # weaker links (mostly explained ones) never join claimants
max_claimants = 12              # larger groups are split with Louvain communities
louvain_resolution = 1.0
louvain_seed = 20261022
repetition_min_claimants = 3    # a weak family counts fully only across this many claimants (P5)
repetition_factor = 0.5

[support]
# Claim-level facts add weight to a network the links already formed, up to `cap` in total.
cap = 0.3
unrecorded_link = 0.15          # a rebuilt link is missing from relationship_edge
provider_concentration = 0.2    # most members use one provider that is not busy
concentration_min_claimants = 3
concentration_min_share = 0.6
inflated_amount = 0.2           # members' invoices at that provider have a median of at least inflated_ratio x peers

[score]
flag_threshold = 0.6
